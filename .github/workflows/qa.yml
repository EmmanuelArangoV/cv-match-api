name: Backend QA

on:
  pull_request:
  push:
    branches: [main, feature/backend-integration]

jobs:
  qa:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      APP_SECRET_KEY: ci-only-secret
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/riwimatch_test
      DATABASE_URL_SYNC: postgresql://postgres:postgres@127.0.0.1:5432/riwimatch_test
      REDIS_URL: redis://127.0.0.1:6379/0
      RUN_INTEGRATION_TESTS: "0"
      TWILIO_MACHINE_DETECTION_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install pytest pytest-asyncio ruff mypy pip-audit
      - run: pip-audit -r requirements.lock
      - run: ruff check src tests
      - run: python scripts/check_mypy_ratchet.py
      - run: pytest -q tests
      - run: docker build -t riwimatch-backend:${{ github.sha }} .
